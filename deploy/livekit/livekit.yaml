# deploy/livekit/livekit.yaml
#
# LiveKit SFU configuration for the EduMapping live-classroom feature.
#
# PORT CHOICES — this VPS is SHARED with several other production sites.
# Ports already taken on the box: 80, 443, 3000, 3001, 3002, 5000, 5001,
# 5002, 5003, 5006, 9000, 9001. Everything below sits in the free 78xx range.
#
#   7880/tcp  HTTP + WebSocket signalling — bound to LOOPBACK ONLY.
#             nginx terminates TLS on 443 for edumapping.com and proxies
#             /livekit to it, so this port is never exposed publicly.
#   7881/tcp  WebRTC ICE/TCP fallback. MUST be reachable from the internet;
#             it cannot sit behind TLS.
#   7882/udp  WebRTC media, port-multiplexed onto a single port instead of the
#             default 50000-60000 range. One UDP port is plenty for a 1 vCPU
#             box and keeps the firewall surface tiny.
#   3478/udp  Embedded TURN (UDP).
#   5349/tcp  Embedded TURN over TLS.
#
# NOTE ON TURN AND PORT 443: LiveKit's docs recommend running TURN/TLS on 443
# because some restrictive networks (school and corporate wifi) block
# everything else. We CANNOT do that here — nginx owns 443 for seven other
# sites, and taking it would break them. 5349 is used instead. Expect a small
# number of users on heavily locked-down networks to fail to connect; see the
# README for the trade-off and the options if that becomes a real problem.

port: 7880
# Bind signalling to loopback — nginx is the only thing that should reach it.
bind_addresses:
  - 127.0.0.1

rtc:
  tcp_port: 7881
  # Single multiplexed UDP port. Set udp_port rather than port_range_start/end
  # so we don't have to open 10,000 ports on a shared host.
  udp_port: 7882
  # The server is behind a NAT-less public IP; let LiveKit discover it.
  use_external_ip: true

# Capacity guard. LiveKit defaults to ~400 tracks per CPU; this box has ONE
# vCPU that is also running Postgres, the Node API and nginx, so we deliberately
# set this well below the theoretical ceiling. See README for the real limits.
limit:
  num_tracks: 150
  bytes_per_sec: 33000000 # ~264 Mbps hard ceiling

# Embedded TURN. Removes the need to install and maintain coturn separately,
# and authenticates against LiveKit's own credentials.
turn:
  enabled: true
  domain: edumapping.com
  tls_port: 5349
  udp_port: 3478
  # Point these at the SAME certificate nginx already uses for the domain.
  # The livekit user must be able to read them (see install script).
  cert_file: /etc/livekit/certs/fullchain.pem
  key_file: /etc/livekit/certs/privkey.pem

# Room defaults. The API also sets these per room at creation time.
room:
  auto_create: false # rooms are created by our API, never implicitly
  empty_timeout: 300 # close 5 min after the last person leaves
  departure_timeout: 60
  max_participants: 60

# Webhooks — attendance and lifecycle events land in Postgres.
webhook:
  api_key: EDUMAPPING_API_KEY_PLACEHOLDER
  urls:
    - http://127.0.0.1:5001/api/conferences/webhook

# Prometheus metrics on loopback. OSS LiveKit exports nothing by default.
prometheus_port: 6789

logging:
  level: info
  json: false

# Keys are injected by the install script from /etc/livekit/keys.env.
# Format is: <api_key>: <api_secret>
keys:
  EDUMAPPING_API_KEY_PLACEHOLDER: EDUMAPPING_API_SECRET_PLACEHOLDER
