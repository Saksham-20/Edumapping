# deploy/livekit/nginx-livekit-location.conf
#
# Paste this INSIDE the existing `server { ... }` block that already serves
# edumapping.com over TLS (443).
#
# ⚠️  SHARED HOST. Edit ONLY the edumapping site file. Do not touch
#     nginx.conf, conf.d/*, or any other site — a bad global config takes down
#     every site on this box. Always run `nginx -t` before reloading, and use
#     `systemctl reload nginx` (graceful) rather than `restart`.
#
# Why proxy at all: livekit-server binds to 127.0.0.1:7880, so the only way in
# is through the TLS that nginx already terminates for this domain. Browsers
# refuse insecure WebSockets from an https page, so this is required, not
# cosmetic.

location /livekit/ {
    proxy_pass http://127.0.0.1:7880/;

    # WebSocket upgrade — without these three lines the signalling connection
    # completes the HTTP handshake and then immediately dies.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A signalling socket stays open for the whole class. The nginx default of
    # 60s would silently drop every participant after a minute.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Media never flows through nginx (it goes direct over UDP 7882 / TCP 7881),
    # so buffering here only adds latency to signalling.
    proxy_buffering off;
}
